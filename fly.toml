
app = "n8n-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  N8N_HOST = "n8n-app.fly.dev"
  N8N_PROTOCOL = "https"
  N8N_PORT = "5678"
  N8N_EDITOR_BASE_URL = "https://n8n-app.fly.dev"
  WEBHOOK_URL = "https://n8n-app.fly.dev/"
  N8N_PROXY_HOPS = "1"
  GENERIC_TIMEZONE = "Asia/Dhaka"
  TZ = "Asia/Dhaka"
  DB_TYPE = "postgresdb"
  DB_POSTGRESDB_SSL = "true"

[http_service]
  internal_port = 5678
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "n8n_data"
  destination = "/home/node/.n8n"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"